name: Save CI diagnostics
description: Upload the job log and generated verification reports.
inputs:
  name:
    description: Unique artifact name for this job.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.name }}
        path: |
          ci.log
          _build/*-report.json
          _build/*-capabilities.json
          _build/why3/
          _build/**/*.proof.json
          _build/**/*.mlw
          examples/_build/**/*.proof.json
          examples/_build/**/*.mlw
          _build/apalache/**/output.log
          _build/apalache/**/*.tla
          _build/apalache/**/*.itf.json
          _build/apalache/report.json
          _build/lease-clock/**/output.log
          _build/lease-clock/**/*.tla
          _build/lease-clock/**/*.itf.json
          _build/lease-clock/report.json
          _build/lease-clock/apalache-report.json
        if-no-files-found: ignore
        retention-days: 7
